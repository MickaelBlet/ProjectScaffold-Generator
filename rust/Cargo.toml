[package]
name = "scaffold-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
indexmap = { version = "2.14.2", features = ["serde"] }
minijinja = { version = "3.0.5", features = ["json", "loop_controls", "preserve_order", "serde", "speedups"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
