# C++17 template set of ProjectScaffold: `scaffold-gen <project file> -o <dir>`.
# Everything C++ lives in these files: the `_*.j2` macros spell types, values, names, paths
# and includes; edit them freely. Paths, `each` and `when` are Jinja; templates see the generation
# context (see README, "Writing templates").
name: cpp17
description: C++17 skeleton - types, interfaces, modules wired through their ports, CMake project; links between binaries over generated transports, with Python peers
comment: '//'
# Names of the model that are C++ keywords (separated by spaces) are warned about, and renamed by
# _id / _accessor / _member.
reserved: >-
  alignas alignof and and_eq asm auto bitand bitor bool break case catch char char16_t char32_t
  class compl const constexpr const_cast continue decltype default delete do double dynamic_cast
  else enum explicit export extern false float for friend goto if inline int long mutable namespace
  new noexcept not not_eq nullptr operator or or_eq private protected public register
  reinterpret_cast return short signed sizeof static static_assert static_cast struct switch
  template this thread_local throw true try typedef typeid typename union unsigned using virtual
  void volatile wchar_t while xor xor_eq
partials:
  - _members.j2
  - _banner.j2
  - _connection.j2
  - _includes.j2
  - _identifier.j2
  - _accessor.j2
  - _member.j2
  - _name.j2
  - _cpp_namespace.j2
  - _qualified_name.j2
  - _header.j2
  - _source.j2
  - _primitive.j2
  - _type.j2
  - _scalar.j2
  - _input.j2
  - _parameters.j2
  - _arguments.j2
  - _endpoint.j2
  - _main_path.j2
  - _value.j2
  - _bounds.j2
  - _labels.j2
  - _py_labels.j2
  - _generated_transport.j2
  - _address.j2
  - _address_variable.j2
  - _settings.j2
  - _py_banner.j2
  - _py_identifier.j2
  - _py_type.j2
  - _py_reference.j2
  - _py_encode.j2
  - _py_encoder.j2
  - _py_decode.j2
  - _py_decoder.j2
  - _py_zero.j2
  - _py_value.j2
  - _py_results.j2
outputs:
  # include/<project>/ports.hpp: the OutPort template used by the out ports of every module.
  - template: ports.hpp.j2
    path: "include/{{ project.name|as_identifier|snake }}/ports.hpp"
    when: modules|length > 0
  # include/<project>/types/<Type>.hpp: one header per type of the project (struct, exception, enum,
  # bitmask, union, alias, custom primitive).
  - template: type.hpp.j2
    each: types
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(entity=item) }}"
  # Types of modules: in the namespace of their module's content, aliased in its class.
  - template: type.hpp.j2
    each: moduleTypes
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(entity=item) }}"
  # include/<project>/types.hpp: includes every type header.
  - template: types.hpp.j2
    path: "include/{{ project.name|as_identifier|snake }}/types.hpp"
    when: types|length > 0
  # include/<project>/constants.hpp: the constants of the project.
  - template: constants.hpp.j2
    path: "include/{{ project.name|as_identifier|snake }}/constants.hpp"
    when: constants|length > 0
  # include/<project>/interfaces/<Interface>.hpp: one abstract class per interface.
  - template: interface.hpp.j2
    each: interfaces
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(entity=item) }}"
  # include/<project>/<namespace>/<Module>.hpp: the class of each module (ports, children, attributes).
  - template: module.hpp.j2
    each: modules
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(entity=item) }}"
  # src/<namespace>/<Module>.cpp: constructor wiring the module's links, user methods and port handlers
  # (not for interfaces, which have no code).
  - template: module.cpp.j2
    each: modules
    when: item.kind != 'interface'
    path: "{% from '_source.j2' import source as _source %}src/{{ _source(entity=item) }}"
  # Calls between binaries: wire format, transports, proxies sending the calls, stubs receiving them.
  # include/<project>/remote/: wire format (wire.hpp), encoding of the types of the remote interfaces
  # (codec.hpp) and the transports (transport.hpp, src/remote/transport.cpp); only when a link crosses
  # binaries (`remoteLinks`).
  - template: wire.hpp.j2
    path: "include/{{ project.name|as_identifier|snake }}/remote/wire.hpp"
    when: remoteLinks|length > 0
  - template: codec.hpp.j2
    path: "include/{{ project.name|as_identifier|snake }}/remote/codec.hpp"
    when: remoteLinks|length > 0
  - template: transport.hpp.j2
    path: "include/{{ project.name|as_identifier|snake }}/remote/transport.hpp"
    when: remoteLinks|length > 0
  - template: transport.cpp.j2
    path: "src/remote/transport.cpp"
    when: remoteLinks|length > 0
  # remote/<Interface>Proxy.hpp: the client side of each remote interface, sending the calls.
  - template: proxy.hpp.j2
    each: remoteInterfaces
    path: "include/{{ project.name|as_identifier|snake }}/remote/{{ item.name }}Proxy.hpp"
  # remote/<Interface>Stub.hpp: the server side, dispatching received calls to a local in port.
  - template: stub.hpp.j2
    each: remoteInterfaces
    path: "include/{{ project.name|as_identifier|snake }}/remote/{{ item.name }}Stub.hpp"
  # One system (and main) per binary of the project, or one for the whole project.
  # include/<project>/<System>.hpp and src/<System>.cpp: instantiate the top-level modules, wire their links,
  # open the proxies and stubs.
  - template: system.hpp.j2
    each: systems
    as: system
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(entity=system) }}"
    when: modules|length > 0
  - template: system.cpp.j2
    each: systems
    as: system
    path: "{% from '_source.j2' import source as _source %}src/{{ _source(entity=system) }}"
    when: modules|length > 0
  # CMakeLists.txt: the library, the dependencies on other projects and one executable per system.
  - template: CMakeLists.txt.j2
    path: "CMakeLists.txt"
    comment: '#'
  # src/[<binary>/]main.cpp: main() of each system.
  - template: main.cpp.j2
    each: systems
    as: system
    path: "{% from '_main_path.j2' import main_path as _main_path %}src/{{ _main_path(system=system) }}"
    when: modules|length > 0
  # Python peers of the binaries (python/<project>/), speaking the wire format of remote/wire.hpp:
  # each stands in for a binary, to test the others.
  # __init__.py, wire.py, transport.py: Python versions of the wire format and the transports;
  # links.py: the remote links; data.py: the types, constants.py: the constants (when remote interfaces use any).
  - template: init.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/__init__.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: wire.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/wire.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: transport.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/transport.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: links.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/links.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: data.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/data.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: constants.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/constants.py"
    when: remoteLinks|length > 0 and remoteConstants|length > 0
    comment: '#'
  # remote/__init__.py and remote/<interface>.py: client and server classes of each remote interface.
  - template: remote_init.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/remote/__init__.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: remote.py.j2
    each: remoteInterfaces
    path: "{% from '_py_identifier.j2' import py_identifier as _py_identifier %}python/{{ project.name|as_identifier|snake }}/remote/{% set module %}{{ item.name|snake }}{% endset %}{{ _py_identifier(name=module) }}.py"
    comment: '#'
  # peers/<binary>.py: one peer per binary that has proxies or stubs, standing in for it.
  - template: peers_init.py.j2
    path: "python/{{ project.name|as_identifier|snake }}/peers/__init__.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: peer.py.j2
    each: systems
    as: system
    when: system.proxies|length > 0 or system.stubs|length > 0
    path: "python/{{ project.name|as_identifier|snake }}/peers/{{ system.binary.name|snake }}.py"
    comment: '#'
