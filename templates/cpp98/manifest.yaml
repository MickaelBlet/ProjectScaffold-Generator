# C++98 template set of ProjectScaffold: `scaffold-gen <project file> -o <dir>`.
# Everything C++ lives in these files: the `_*.j2` macros spell types, values, names, paths
# and includes; edit them freely. Paths, `each` and `when` are Jinja; templates see the generation
# context (see README, "Writing templates").
name: cpp98
description: C++98 skeleton - types, interfaces, modules wired through their ports, CMake project; links between binaries over generated transports, with Python peers
comment: '//'
# Names of the model that are C++ keywords (separated by spaces) are warned about, and renamed by
# _id / _accessor / _member.
reserved: >-
  alignas alignof and and_eq asm auto bitand bitor bool break case catch char char16_t char32_t
  class compl const constexpr const_cast continue decltype default delete do double dynamic_cast
  else enum explicit export extern false float for friend goto if inline int long mutable namespace
  new noexcept not not_eq nullptr operator or or_eq private protected public register
  reinterpret_cast return short signed sizeof static static_assert static_cast struct switch
  template this thread_local throw true try typedef typeid typename union unsigned using virtual
  void volatile wchar_t while xor xor_eq
partials:
  - _members.j2
  - _banner.j2
  - _connection.j2
  - _includes.j2
  - _id.j2
  - _accessor.j2
  - _member.j2
  - _name.j2
  - _ns.j2
  - _init.j2
  - _namespace_open.j2
  - _namespace_close.j2
  - _qualified.j2
  - _header.j2
  - _source.j2
  - _primitive.j2
  - _type.j2
  - _scalar.j2
  - _input.j2
  - _params.j2
  - _args.j2
  - _endpoint.j2
  - _main.j2
  - _value.j2
  - _bounds.j2
  - _labels.j2
  - _py_labels.j2
  - _generated_transport.j2
  - _address.j2
  - _address_variable.j2
  - _settings.j2
  - _py_banner.j2
  - _py_id.j2
  - _py_type.j2
  - _py_ref.j2
  - _py_encode.j2
  - _py_encoder.j2
  - _py_decode.j2
  - _py_decoder.j2
  - _py_zero.j2
  - _py_value.j2
  - _py_results.j2
outputs:
  - template: ports.hpp.j2
    path: "include/{{ project.ident|snake }}/ports.hpp"
    when: modules|length > 0
  - template: type.hpp.j2
    each: types
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(e=item) }}"
  # Types of modules: in the namespace of their module's content, aliased in its class.
  - template: type.hpp.j2
    each: moduleTypes
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(e=item) }}"
  # What C++98 lacks, the same in every project: scaffold::Optional, Array, Make.
  - template: support.hpp.j2
    path: "include/scaffold/support.hpp"
  - template: types.hpp.j2
    path: "include/{{ project.ident|snake }}/types.hpp"
    when: types|length > 0
  - template: constants.hpp.j2
    path: "include/{{ project.ident|snake }}/constants.hpp"
    when: constants|length > 0
  - template: interface.hpp.j2
    each: interfaces
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(e=item) }}"
  - template: module.hpp.j2
    each: modules
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(e=item) }}"
  - template: module.cpp.j2
    each: modules
    when: item.kind != 'interface'
    path: "{% from '_source.j2' import source as _source %}src/{{ _source(e=item) }}"
  # Calls between binaries: wire format, transports, proxies sending the calls, stubs receiving them.
  - template: wire.hpp.j2
    path: "include/{{ project.ident|snake }}/remote/wire.hpp"
    when: remoteLinks|length > 0
  - template: codec.hpp.j2
    path: "include/{{ project.ident|snake }}/remote/codec.hpp"
    when: remoteLinks|length > 0
  - template: transport.hpp.j2
    path: "include/{{ project.ident|snake }}/remote/transport.hpp"
    when: remoteLinks|length > 0
  - template: transport.cpp.j2
    path: "src/remote/transport.cpp"
    when: remoteLinks|length > 0
  - template: proxy.hpp.j2
    each: remoteInterfaces
    path: "include/{{ project.ident|snake }}/remote/{{ item.name }}Proxy.hpp"
  - template: stub.hpp.j2
    each: remoteInterfaces
    path: "include/{{ project.ident|snake }}/remote/{{ item.name }}Stub.hpp"
  # One system (and main) per binary of the project, or one for the whole project.
  - template: system.hpp.j2
    each: systems
    as: system
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(e=system) }}"
    when: modules|length > 0
  - template: system.cpp.j2
    each: systems
    as: system
    path: "{% from '_source.j2' import source as _source %}src/{{ _source(e=system) }}"
    when: modules|length > 0
  - template: CMakeLists.txt.j2
    path: "CMakeLists.txt"
    comment: '#'
  - template: main.cpp.j2
    each: systems
    as: system
    path: "{% from '_main.j2' import main as _main %}src/{{ _main(system=system) }}"
    when: modules|length > 0
  # Python peers of the binaries (python/<project>/), speaking the wire format of remote/wire.hpp:
  # each stands in for a binary, to test the others.
  - template: init.py.j2
    path: "python/{{ project.ident|snake }}/__init__.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: wire.py.j2
    path: "python/{{ project.ident|snake }}/wire.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: transport.py.j2
    path: "python/{{ project.ident|snake }}/transport.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: links.py.j2
    path: "python/{{ project.ident|snake }}/links.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: data.py.j2
    path: "python/{{ project.ident|snake }}/data.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: constants.py.j2
    path: "python/{{ project.ident|snake }}/constants.py"
    when: remoteLinks|length > 0 and remoteConstants|length > 0
    comment: '#'
  - template: remote_init.py.j2
    path: "python/{{ project.ident|snake }}/remote/__init__.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: remote.py.j2
    each: remoteInterfaces
    path: "{% from '_py_id.j2' import py_id as _py_id %}python/{{ project.ident|snake }}/remote/{% set module %}{{ item.name|snake }}{% endset %}{{ _py_id(name=module) }}.py"
    comment: '#'
  - template: peers_init.py.j2
    path: "python/{{ project.ident|snake }}/peers/__init__.py"
    when: remoteLinks|length > 0
    comment: '#'
  - template: peer.py.j2
    each: systems
    as: system
    when: system.proxies|length > 0 or system.stubs|length > 0
    path: "python/{{ project.ident|snake }}/peers/{{ system.binary.name|snake }}.py"
    comment: '#'
