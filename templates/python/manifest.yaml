# Python template set of ProjectScaffold: `npm run generate -- <project file> -t python -o <dir>`.
# A Python package (3.8+, standard library only): types, interfaces, one module per module, systems
# wired through the ports, and the calls between binaries over the same wire format and transports
# as the C++ template sets. The `_py_*` partials spell the Python of the model; edit them freely.
name: python
description: Python 3.8+ package - types (dataclasses, enums), interfaces (ABCs), modules wired through their ports, systems; links between binaries over generated transports
comment: '#'
# Names of the model that are Python keywords (separated by spaces) are warned about, and renamed by
# _py_id (a trailing `_`).
reserved: >-
  False None True and as assert async await break class continue def del elif else except finally
  for from global if import in is lambda nonlocal not or pass raise return self try while with yield
partials:
  - _py_banner.j2
  - _py_id.j2
  - _py_class.j2
  - _py_accessor.j2
  - _py_module_path.j2
  - _py_endpoint.j2
  - _py_params.j2
  - _py_args.j2
  - _py_connection.j2
  - _py_type.j2
  - _py_ref.j2
  - _py_encode.j2
  - _py_encoder.j2
  - _py_decode.j2
  - _py_decoder.j2
  - _py_zero.j2
  - _py_value.j2
  - _py_results.j2
  - _py_labels.j2
  - _address.j2
  - _address_variable.j2
  - _settings.j2
outputs:
  - template: pyproject.toml.j2
    path: "pyproject.toml"
  - template: init.py.j2
    path: "{{ project.ident|snake }}/__init__.py"
  - template: main.py.j2
    path: "{{ project.ident|snake }}/__main__.py"
    when: modules|length > 0
  - template: wire.py.j2
    path: "{{ project.ident|snake }}/wire.py"
  - template: data.py.j2
    path: "{{ project.ident|snake }}/data.py"
  - template: module_types.py.j2
    path: "{{ project.ident|snake }}/module_types.py"
    when: allModuleTypes|length > 0
  - template: constants.py.j2
    path: "{{ project.ident|snake }}/constants.py"
    when: constants|length > 0
  - template: interfaces.py.j2
    path: "{{ project.ident|snake }}/interfaces.py"
  - template: ports.py.j2
    path: "{{ project.ident|snake }}/ports.py"
    when: modules|length > 0
  # One Python module per module; a module with children is a package (its class in __init__.py).
  - template: modules_init.py.j2
    path: "{{ project.ident|snake }}/modules/__init__.py"
    when: modules|length > 0
  - template: module.py.j2
    each: modules
    path: "{% from '_py_module_path.j2' import py_module_path as _py_module_path %}{% set p %}{{ _py_module_path(m=item) }}{% endset %}{{ p|replace('.', '/') }}{% if item.children|length > 0 %}/__init__.py{% else %}.py{% endif %}"
  # One system per binary of the project, or one for the whole project.
  - template: systems_init.py.j2
    path: "{{ project.ident|snake }}/systems/__init__.py"
    when: modules|length > 0
  - template: system.py.j2
    each: systems
    as: system
    path: "{% from '_py_id.j2' import py_id as _py_id %}{{ project.ident|snake }}/systems/{% set file %}{{ system.name|snake }}{% endset %}{{ _py_id(name=file) }}.py"
    when: modules|length > 0
  # Calls between binaries: transports, link addresses, proxies / handlers / stubs, peers.
  - template: transport.py.j2
    path: "{{ project.ident|snake }}/transport.py"
    when: remoteLinks|length > 0
  - template: links.py.j2
    path: "{{ project.ident|snake }}/links.py"
    when: remoteLinks|length > 0
  - template: remote_init.py.j2
    path: "{{ project.ident|snake }}/remote/__init__.py"
    when: remoteLinks|length > 0
  - template: remote.py.j2
    each: remoteInterfaces
    path: "{% from '_py_id.j2' import py_id as _py_id %}{{ project.ident|snake }}/remote/{% set module %}{{ item.name|snake }}{% endset %}{{ _py_id(name=module) }}.py"
  - template: peers_init.py.j2
    path: "{{ project.ident|snake }}/peers/__init__.py"
    when: remoteLinks|length > 0
  - template: peer.py.j2
    each: systems
    as: system
    when: system.proxies|length > 0 or system.stubs|length > 0
    path: "{{ project.ident|snake }}/peers/{{ system.binary.name|snake }}.py"