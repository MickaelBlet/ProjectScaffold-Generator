# SCA 2.2.2 template set of ProjectScaffold (C++98, CORBA with omniORB 4):
# `scaffold-gen <project file> -t sca-cpp98 -o <dir>`.
# Types, constants and interfaces become IDL (idl/<project>.idl); each concrete top-level module an
# SCA component (CF::Resource: provides ports as servants of their interface, uses ports as
# CF::Port, attributes as properties) with its descriptors (SPD, SCD, PRF); each binary an
# executable serving its components (those of no binary: one more); the project a waveform (SAD;
# binaries as host collocations) and a launcher running it in one process.
# Everything C++ / IDL lives in these files: the `_cx_*` partials spell the C++ mapping of IDL, the
# `_idl_*` ones the IDL of the model; edit them freely.
name: sca-cpp98
description: SCA 2.2.2 components in C++98 over CORBA (omniORB) - IDL, CF::Resource components, SPD / SCD / PRF / SAD descriptors, CMake project, waveform launcher
comment: '//'
# C++ keywords (separated by spaces): names of the model among them are warned about, and renamed by
# _id / _accessor / _member (the C++ mapping prefixes IDL names with `_cxx_`). IDL keywords are
# escaped by _idl_id.
reserved: >-
  alignas alignof and and_eq asm auto bitand bitor bool break case catch char char16_t char32_t
  class compl const constexpr const_cast continue decltype default delete do double dynamic_cast
  else enum explicit export extern false float for friend goto if inline int long mutable namespace
  new noexcept not not_eq nullptr operator or or_eq private protected public register
  reinterpret_cast return short signed sizeof static static_assert static_cast struct switch
  template this thread_local throw true try typedef typeid typename union unsigned using virtual
  void volatile wchar_t while xor xor_eq
partials:
  - _members.j2
  - _banner.j2
  - _xml_banner.j2
  - _id.j2
  - _accessor.j2
  - _member.j2
  - _ns.j2
  - _qualified.j2
  - _header.j2
  - _source.j2
  - _namespace_open.j2
  - _namespace_close.j2
  - _component.j2
  - _iface_ns.j2
  - _repid.j2
  - _endpoint.j2
  - _exposed.j2
  - _port_name.j2
  - _waveform_links.j2
  - _init.j2
  - _idl_id.j2
  - _idl_member.j2
  - _idl_prim.j2
  - _idl_name.j2
  - _idl_type.j2
  - _idl_literal.j2
  - _idl_containers.j2
  - _idl_decl.j2
  - _idl_forward.j2
  - _idl_type_containers.j2
  - _cx_id.j2
  - _cx_member_id.j2
  - _cx_kind.j2
  - _cx_prim.j2
  - _variable.j2
  - _cx_name.j2
  - _cx_in.j2
  - _cx_params.j2
  - _cx_args.j2
  - _cx_ret.j2
  - _cx_member.j2
  - _cx_get.j2
  - _cx_empty.j2
  - _cx_outs.j2
  - _cx_literal.j2
  - _cx_init.j2
  - _any_get.j2
  - _any_put.j2
  - _prf_type.j2
  - _prf_value.j2
  - _scd_port.j2
  - _sad_placement.j2
outputs:
  # IDL: the Core Framework interfaces a component needs, and the project's.
  - template: CF.idl.j2
    path: "idl/CF.idl"
  - template: idl.j2
    path: "idl/{{ project.ident|snake }}.idl"
  # What every component uses, the same in every project: sca::Resource, sca::UsesPort, sca::Runtime.
  - template: support.hpp.j2
    path: "include/sca/support.hpp"
  - template: support.cpp.j2
    path: "src/sca/support.cpp"
  - template: module.hpp.j2
    each: modules
    path: "{% from '_header.j2' import header as _header %}include/{{ _header(e=item) }}"
  - template: module.cpp.j2
    each: modules
    when: item.kind != 'interface'
    path: "{% from '_source.j2' import source as _source %}src/{{ _source(e=item) }}"
  # Executables: one per binary serving its components, one serving the components of no binary.
  - template: binary_main.cpp.j2
    each: binaries
    as: binary
    when: "modules|selectattr('depth', 'equalto', 0)|selectattr('abstract', 'equalto', false)|selectattr('binary', 'equalto', binary.name)|first"
    path: "src/main/{{ binary.name|snake }}_main.cpp"
  - template: binary_main.cpp.j2
    each: "(modules|selectattr('depth', 'equalto', 0)|selectattr('abstract', 'equalto', false)|selectattr('binary', 'none'))[0:][:1]|map(attribute='binary')"
    as: binary
    path: "src/main/main.cpp"
  # Components: concrete top-level modules.
  - template: spd.xml.j2
    each: modules
    when: item.depth == 0 and item.abstract == false
    path: "dom/components/{{ item.name }}/{{ item.name }}.spd.xml"
    comment: '#'
  - template: scd.xml.j2
    each: modules
    when: item.depth == 0 and item.abstract == false
    path: "dom/components/{{ item.name }}/{{ item.name }}.scd.xml"
    comment: '#'
  - template: prf.xml.j2
    each: modules
    when: item.depth == 0 and item.abstract == false
    path: "dom/components/{{ item.name }}/{{ item.name }}.prf.xml"
    comment: '#'
  # The waveform: its assembly, and a launcher running it in one process.
  - template: sad.xml.j2
    path: "dom/waveforms/{{ project.ident|snake }}/{{ project.ident|snake }}.sad.xml"
    when: "modules|selectattr('depth', 'equalto', 0)|selectattr('abstract', 'equalto', false)|first"
    comment: '#'
  - template: waveform.cpp.j2
    path: "src/main/waveform.cpp"
    when: "modules|selectattr('depth', 'equalto', 0)|selectattr('abstract', 'equalto', false)|first"
  - template: CMakeLists.txt.j2
    path: "CMakeLists.txt"
    comment: '#'
